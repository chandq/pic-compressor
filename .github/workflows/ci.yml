name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify
